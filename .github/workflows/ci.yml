name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

env:
  GOLANGCI_VERSION: 'v2.14.0'
  DOCKER_BUILDX_VERSION: 'v0.34.1'
  UPSTREAM_REPO: PostHog/terraform-provider-posthog

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: make vendor vendor.check
      - run: make repo-checks
      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: ${{ env.GOLANGCI_VERSION }}

  check-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: make vendor vendor.check
      - run: make check-diff

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: make vendor vendor.check
      - run: make -j2 test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: all
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: make vendor vendor.check
      - run: make -j2 build.all
        env:
          BUILD_ARGS: "--load"

  example-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.32.0
          install_only: true
      - run: hack/validate-examples.sh

  script-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: make test-scripts

  crd-breaking-changes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: hack/breaking-changes.sh crds
        env:
          GH_TOKEN: ${{ github.token }}

  report:
    needs:
      - lint
      - check-diff
      - unit-tests
      - build
      - example-validation
      - script-tests
      - crd-breaking-changes
    if: failure() && startsWith(github.head_ref, 'upstream/v')
    runs-on: ubuntu-24.04
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - if: env.APP_CLIENT_ID == ''
        run: echo "::notice::No failure issue opened, GitHub App secret APP_CLIENT_ID is not configured. See SPEC.md section 12 (one-time setup)."
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: env.APP_CLIENT_ID != ''
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: env.APP_CLIENT_ID != ''
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Open failure issue
        if: env.APP_CLIENT_ID != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
          LABEL: >-
            ${{ needs.check-diff.result == 'failure' && 'generation'
            || (needs.lint.result == 'failure' || needs.build.result == 'failure') && 'build'
            || needs.crd-breaking-changes.result == 'failure' && 'breaking-change'
            || 'test' }}
        run: hack/failure-issue.sh "${HEAD_REF#upstream/v}" "CI ${LABEL}" "$LABEL"
