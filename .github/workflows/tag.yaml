name: Tag

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version without the leading v (e.g. 1.0.25)'
        required: true
      sha:
        description: 'Commit on main to tag'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: PostHog/terraform-provider-posthog

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'upstream/v')
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.check.outputs.app }}
    steps:
      - id: check
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub App secrets not configured: the tag is created with GITHUB_TOKEN and failures open no issue. See SPEC.md section 12."
          fi

  tag:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      VERSION: ${{ inputs.version || github.event.pull_request.head.ref }}
      SHA: ${{ inputs.sha || github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: needs.gate.outputs.app == 'true'
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Normalize version
        id: version
        run: |
          normalized=${VERSION#upstream/}
          echo "VERSION=${normalized#v}" >> "$GITHUB_ENV"
          echo "version=${normalized#v}" >> "$GITHUB_OUTPUT"
      - name: Create tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: hack/tag.sh "$VERSION" "$SHA"
      - name: Open failure issue
        if: failure() && needs.gate.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: hack/failure-issue.sh "$VERSION" tag release

  publish:
    needs: tag
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-provider-package.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      XPKG_ACCESS_ID: ${{ secrets.XPKG_ACCESS_ID }}
      XPKG_TOKEN: ${{ secrets.XPKG_TOKEN }}
