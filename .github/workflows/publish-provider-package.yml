name: Publish Provider Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version without the leading v (e.g. 1.0.25)'
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      APP_CLIENT_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      XPKG_ACCESS_ID:
        required: false
      XPKG_TOKEN:
        required: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILDX_VERSION: 'v0.34.1'
  UPSTREAM_REPO: PostHog/terraform-provider-posthog
  TAG: v${{ inputs.version }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.check.outputs.app }}
      upbound: ${{ steps.check.outputs.upbound }}
    steps:
      - id: check
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          XPKG_ACCESS_ID: ${{ secrets.XPKG_ACCESS_ID }}
          XPKG_TOKEN: ${{ secrets.XPKG_TOKEN }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub App secrets not configured: the release uses GITHUB_TOKEN and upstream tracking is not dispatched. See SPEC.md section 12."
          fi
          if [ -n "$XPKG_ACCESS_ID" ] && [ -n "$XPKG_TOKEN" ]; then
            echo "upbound=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: Upbound secrets XPKG_ACCESS_ID and XPKG_TOKEN not configured. See SPEC.md section 12."
          fi

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          swap-storage: false
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: all
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Build
        run: make -j2 build.all VERSION="$TAG"
        env:
          BUILD_ARGS: "--load"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xpkg
          path: _output/xpkg/*/provider-posthog-${{ env.TAG }}.xpkg
          if-no-files-found: error
          retention-days: 1

  ghcr:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            Makefile
            hack/push-xpkg.sh
            extensions/icons/icon.svg
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xpkg
          path: xpkg
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: hack/push-xpkg.sh "ghcr.io/cliftonz/provider-upjet-posthog:${TAG}"

  upbound:
    needs: [gate, build]
    if: needs.gate.outputs.upbound == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            Makefile
            hack/push-xpkg.sh
            extensions/icons/icon.svg
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xpkg
          path: xpkg
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.XPKG_ACCESS_ID }}
          password: ${{ secrets.XPKG_TOKEN }}
      - run: hack/push-xpkg.sh "xpkg.upbound.io/cliftonz/provider-upjet-posthog:${TAG}"

  release:
    needs: [gate, ghcr]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: needs.gate.outputs.app == 'true'
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          if ! out=$(gh release view "$TAG" 2>&1); then
            if [ "$out" != "release not found" ]; then
              echo "$out" >&2
              exit 1
            fi
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --latest
          fi
      - name: Dispatch upstream tracking
        if: needs.gate.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh workflow run upstream-tracking.yml

  report:
    needs: [gate, build, ghcr, upbound, release]
    if: failure() && needs.gate.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          UPSTREAM_VERSION: ${{ inputs.version }}
        run: hack/failure-issue.sh "$UPSTREAM_VERSION" publish publish
