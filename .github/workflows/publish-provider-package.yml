name: Publish Provider Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version without the leading v (e.g. 1.0.25)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILDX_VERSION: 'v0.34.1'
  UPSTREAM_REPO: PostHog/terraform-provider-posthog
  PACKAGE: xpkg.upbound.io/cliftonz/provider-posthog

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      TAG: v${{ inputs.version }}
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          swap-storage: false
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: all
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.XPKG_ACCESS_ID }}
          password: ${{ secrets.XPKG_TOKEN }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Check for existing package
        id: package
        run: |
          if out=$(docker buildx imagetools inspect "${PACKAGE}:${TAG}" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif ! grep -q 'not found' <<< "$out"; then
            echo "$out" >&2
            exit 1
          fi
      - name: Build
        if: steps.package.outputs.exists != 'true'
        run: make -j2 build.all VERSION="$TAG"
        env:
          BUILD_ARGS: "--load"
      - name: Push
        if: steps.package.outputs.exists != 'true'
        run: make xpkg.release.publish VERSION="$TAG"

  release:
    needs: package
    runs-on: ubuntu-24.04
    env:
      TAG: v${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if ! out=$(gh release view "$TAG" 2>&1); then
            if [ "$out" != "release not found" ]; then
              echo "$out" >&2
              exit 1
            fi
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --latest
          fi
      - name: Dispatch upstream tracking
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh workflow run upstream-tracking.yml

  report:
    needs: [package, release]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          UPSTREAM_VERSION: ${{ inputs.version }}
        run: hack/failure-issue.sh "$UPSTREAM_VERSION" publish publish
