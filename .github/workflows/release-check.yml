name: Release Check

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version without the leading v (e.g. 1.0.27)'
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          swap-storage: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/posthog-e2e
          key: posthog-snapshot-${{ hashFiles('test/harness/images.env', 'test/harness/bootstrap.py', 'test/harness/manifests/**') }}
      - name: Install check and e2e of the released package
        timeout-minutes: 130
        env:
          E2E_LANES: 1
          VERSION: v${{ inputs.version }}
        run: make e2e-release VERSION="$VERSION"
