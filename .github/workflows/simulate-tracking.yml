name: Simulate Upstream Tracking

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to track, without the leading v (default: newest upstream release)'
        required: false
      latest:
        description: 'Our pretended latest release, without the leading v (default: the upstream release before it)'
        required: false

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          swap-storage: false
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: all
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
        with:
          version: v0.34.1
          install: true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Simulate upstream tracking
        env:
          SIM_VERSION: ${{ inputs.version }}
          SIM_LATEST: ${{ inputs.latest }}
        run: make simulate-tracking
