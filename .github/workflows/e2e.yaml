name: End to End Testing

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_REPO: PostHog/terraform-provider-posthog

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action != 'labeled' || github.event.label.name == 'run-e2e')
      && (startsWith(github.head_ref, 'upstream/v')
      || startsWith(github.head_ref, 'upjet/')
      || contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          swap-storage: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: e2e-go-${{ hashFiles('go.sum') }}-${{ hashFiles('apis/**', 'config/**', 'internal/**', 'cmd/**') }}
          restore-keys: e2e-go-${{ hashFiles('go.sum') }}-
      - id: snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/posthog-e2e
          key: posthog-snapshot-${{ hashFiles('test/harness/images.env', 'test/harness/bootstrap.py', 'test/harness/manifests/**') }}
      - name: Start harness
        run: test/harness/up.sh
      - if: steps.snapshot.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/posthog-e2e
          key: posthog-snapshot-${{ hashFiles('test/harness/images.env', 'test/harness/bootstrap.py', 'test/harness/manifests/**') }}
      - name: Run e2e
        timeout-minutes: 75
        run: hack/e2e.sh

  snapshot:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/posthog-e2e
          key: posthog-snapshot-${{ hashFiles('test/harness/images.env', 'test/harness/bootstrap.py', 'test/harness/manifests/**') }}
          lookup-only: true
      - if: steps.snapshot.outputs.cache-hit != 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          swap-storage: false
      - if: steps.snapshot.outputs.cache-hit != 'true'
        name: Bake snapshot
        run: test/harness/up.sh
      - if: steps.snapshot.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/posthog-e2e
          key: posthog-snapshot-${{ hashFiles('test/harness/images.env', 'test/harness/bootstrap.py', 'test/harness/manifests/**') }}

  go-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: e2e-go-${{ hashFiles('go.sum') }}-${{ hashFiles('apis/**', 'config/**', 'internal/**', 'cmd/**') }}
          restore-keys: e2e-go-${{ hashFiles('go.sum') }}-
      - run: make build PLATFORMS=linux_amd64

  report:
    needs: e2e
    if: failure() && startsWith(github.head_ref, 'upstream/v')
    runs-on: ubuntu-24.04
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - if: env.APP_CLIENT_ID == ''
        run: echo "::notice::No failure issue opened, GitHub App secret APP_CLIENT_ID is not configured. See SPEC.md section 12 (one-time setup)."
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: env.APP_CLIENT_ID != ''
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: env.APP_CLIENT_ID != ''
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Open failure issue
        if: env.APP_CLIENT_ID != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: hack/failure-issue.sh "${HEAD_REF#upstream/v}" "e2e" test
