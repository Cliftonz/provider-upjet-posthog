apiVersion: analytics.posthog.m.clifton.quest/v1alpha1
kind: Subscription
metadata:
  annotations:
    meta.upbound.io/example-id: analytics/v1alpha1/subscription
  labels:
    testing.upbound.io/example-name: daily_slack_digest
  name: daily-slack-digest
  namespace: crossplane-system
spec:
  forProvider:
    dashboardExportInsights:
    - ${posthog_insight.signups.id}
    - ${posthog_insight.revenue.id}
    dashboardIdSelector:
      matchLabels:
        testing.upbound.io/example-name: key_metrics
    frequency: daily
    integrationId: 1
    interval: 1
    startDate: "2026-08-17T07:00:00Z"
    targetType: slack
    targetValue: C0B9A53J8RF|#reports
    title: Daily key metrics

---

apiVersion: analytics.posthog.m.clifton.quest/v1alpha1
kind: Insight
metadata:
  annotations:
    meta.upbound.io/example-id: analytics/v1alpha1/subscription
  labels:
    testing.upbound.io/example-name: revenue
  name: revenue
  namespace: crossplane-system
spec:
  forProvider:
    dashboardIdsRefs:
    - name: key_metrics
    name: Revenue
    queryJson: |-
      ${jsonencode({
          kind = "InsightVizNode"
          source = {
            kind   = "TrendsQuery"
            series = [{ kind = "EventsNode", event = "purchase", math = "sum" }]
          }
        })}

---

apiVersion: analytics.posthog.m.clifton.quest/v1alpha1
kind: Insight
metadata:
  annotations:
    meta.upbound.io/example-id: analytics/v1alpha1/subscription
  labels:
    testing.upbound.io/example-name: signups
  name: signups
  namespace: crossplane-system
spec:
  forProvider:
    dashboardIdsRefs:
    - name: key_metrics
    name: Signups
    queryJson: |-
      ${jsonencode({
          kind = "InsightVizNode"
          source = {
            kind   = "TrendsQuery"
            series = [{ kind = "EventsNode", event = "sign up", math = "total" }]
          }
        })}
