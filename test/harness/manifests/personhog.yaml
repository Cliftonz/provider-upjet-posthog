apiVersion: v1
kind: Service
metadata:
  name: personhog-replica
spec:
  selector: {app: personhog-replica}
  ports: [{port: 50051}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: personhog-replica
spec:
  selector: {matchLabels: {app: personhog-replica}}
  template:
    metadata: {labels: {app: personhog-replica}}
    spec:
      enableServiceLinks: false
      containers:
        - name: personhog-replica
          image: ${PERSONHOG_REPLICA_IMAGE}
          env:
            - {name: GRPC_ADDRESS, value: "0.0.0.0:50051"}
            - {name: PRIMARY_DATABASE_URL, value: "postgres://posthog:posthog@db:5432/posthog"}
            - {name: RUST_LOG, value: info}
---
apiVersion: v1
kind: Service
metadata:
  name: personhog-router
spec:
  selector: {app: personhog-router}
  ports: [{port: 50052}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: personhog-router
spec:
  selector: {matchLabels: {app: personhog-router}}
  template:
    metadata: {labels: {app: personhog-router}}
    spec:
      enableServiceLinks: false
      containers:
        - name: personhog-router
          image: ${PERSONHOG_ROUTER_IMAGE}
          env:
            - {name: GRPC_ADDRESS, value: "0.0.0.0:50052"}
            - {name: REPLICA_URL, value: "http://personhog-replica:50051"}
            - {name: BACKEND_TIMEOUT_MS, value: "5000"}
            - {name: RUST_LOG, value: info}
