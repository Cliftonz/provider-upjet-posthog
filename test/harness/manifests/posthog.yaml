apiVersion: v1
kind: ConfigMap
metadata:
  name: posthog-env
data:
  DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
  PGHOST: db
  PGUSER: posthog
  PGPASSWORD: posthog
  PERSONS_DB_WRITER_URL: postgres://posthog:posthog@db:5432/posthog
  PERSONS_DB_READER_URL: postgres://posthog:posthog@db:5432/posthog
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_DATABASE: posthog
  CLICKHOUSE_SECURE: "false"
  CLICKHOUSE_VERIFY: "false"
  CLICKHOUSE_API_USER: api
  CLICKHOUSE_API_PASSWORD: apipass
  CLICKHOUSE_APP_USER: app
  CLICKHOUSE_APP_PASSWORD: apppass
  CLICKHOUSE_BILLING_USER: billing
  CLICKHOUSE_BILLING_PASSWORD: billingpass
  CLICKHOUSE_DICT_READER_USER: dict_reader
  CLICKHOUSE_DICT_READER_PASSWORD: dictreaderpass
  CLICKHOUSE_SIGNALS_USER: signals
  CLICKHOUSE_SIGNALS_PASSWORD: signalspass
  CLICKHOUSE_LOGS_CLUSTER_HOST: clickhouse
  CLICKHOUSE_LOGS_CLUSTER_SECURE: "false"
  REDIS_URL: redis://redis7:6379/
  KAFKA_HOSTS: kafka:9092
  OBJECT_STORAGE_ENABLED: "true"
  OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
  OBJECT_STORAGE_ACCESS_KEY_ID: object_storage_root_user
  OBJECT_STORAGE_SECRET_ACCESS_KEY: object_storage_root_password
  OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
  TEMPORAL_HOST: temporal
  IS_BEHIND_PROXY: "true"
  DISABLE_SECURE_SSL_REDIRECT: "true"
  OTEL_SDK_DISABLED: "true"
  DEPLOYMENT: hobby
  SITE_URL: ${POSTHOG_HOST}
  SECRET_KEY: posthog-e2e-harness-not-a-secret
  ENCRYPTION_SALT_KEYS: 00beef0000beef0000beef0000beef00
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector: {app: web}
  ports: [{port: 8000, nodePort: 30800}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: ${POSTHOG_IMAGE}
          command:
            - sh
            - -c
            - |
              python3 -c "
              import socket, time
              for target in (('db', 5432), ('clickhouse', 9000)):
                  while socket.socket().connect_ex(target):
                      time.sleep(2)
              " && ./bin/migrate && exec ./bin/docker-server
          envFrom: [{configMapRef: {name: posthog-env}}]
          readinessProbe:
            httpGet: {path: "/_readyz?role=web", port: 8000}
            periodSeconds: 10
            timeoutSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      enableServiceLinks: false
      containers:
        - name: worker
          image: ${POSTHOG_IMAGE}
          command: [./bin/docker-worker-celery, --with-scheduler]
          envFrom: [{configMapRef: {name: posthog-env}}]
          env: [{name: POSTHOG_SKIP_MIGRATION_CHECKS, value: "1"}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-django-worker
spec:
  selector: {matchLabels: {app: temporal-django-worker}}
  template:
    metadata: {labels: {app: temporal-django-worker}}
    spec:
      enableServiceLinks: false
      containers:
        - name: temporal-django-worker
          image: ${POSTHOG_IMAGE}
          command: [./bin/temporal-django-worker]
          envFrom: [{configMapRef: {name: posthog-env}}]
          env: [{name: POSTHOG_SKIP_MIGRATION_CHECKS, value: "1"}]
