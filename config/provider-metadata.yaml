              dependencies:
                posthog_role.engineering: |-
                    {
                      "name": "Engineering",
                      "organization_id": "your-organization-uuid"
                    }
        argumentDocs:
            id: (String) The UUID of the role membership.
            joined_at: (String) Timestamp when the user joined the role.
            organization_id: (String) Organization for this resource. Overrides the provider-level organization_id. Accepts an organization UUID, an organization slug, or the literal @current (the authenticated user's organization); slugs and @current are resolved to a UUID for API calls while your original value is preserved in state.
            role_id: (String) The UUID of the role.
            user_email: (String) The email address of the user.
            user_uuid: (String) The UUID of the user to add to the role.
        importStatements:
            - |-
              # Import a role membership using the format: organization_id/role_id/membership_id
              terraform import posthog_role_membership.alice_engineering your-organization-uuid/your-role-uuid/your-membership-uuid
    posthog_subscription:
        subCategory: ""
        description: Manage PostHog subscriptions. A subscription delivers a recurring dashboard or insight digest to email or Slack on an rrule schedule.
        name: posthog_subscription
        title: posthog_subscription Resource - posthog
        examples:
            - name: daily_slack_digest
              manifest: |-
                {
                  "dashboard_export_insights": [
                    "${posthog_insight.signups.id}",
                    "${posthog_insight.revenue.id}"
                  ],
                  "dashboard_id": "${posthog_dashboard.key_metrics.id}",
                  "frequency": "daily",
                  "integration_id": 1,
                  "interval": 1,
                  "start_date": "2026-08-17T07:00:00Z",
                  "target_type": "slack",
                  "target_value": "C0B9A53J8RF|#reports",
                  "title": "Daily key metrics"
                }
              references:
                dashboard_export_insights: posthog_insight.signups.id
                dashboard_id: posthog_dashboard.key_metrics.id
              dependencies:
                posthog_dashboard.key_metrics: |-
                    {
                      "name": "Key metrics"
                    }
                posthog_insight.revenue: |-
                    {
                      "dashboard_ids": [
                        "${posthog_dashboard.key_metrics.id}"
                      ],
                      "name": "Revenue",
                      "query_json": "${jsonencode({\n    kind = \"InsightVizNode\"\n    source = {\n      kind   = \"TrendsQuery\"\n      series = [{ kind = \"EventsNode\", event = \"purchase\", math = \"sum\" }]\n    }\n  })}"
                    }
                posthog_insight.signups: |-
                    {
                      "dashboard_ids": [
                        "${posthog_dashboard.key_metrics.id}"
                      ],
                      "name": "Signups",
                      "query_json": "${jsonencode({\n    kind = \"InsightVizNode\"\n    source = {\n      kind   = \"TrendsQuery\"\n      series = [{ kind = \"EventsNode\", event = \"sign up\", math = \"total\" }]\n    }\n  })}"
                    }
            - name: weekly_insight_email
              manifest: |-
                {
                  "byweekday": [
                    "monday"
                  ],
                  "frequency": "weekly",
                  "insight_id": "${posthog_insight.signups.id}",
                  "interval": 1,
                  "start_date": "2026-08-17T07:00:00Z",
                  "target_type": "email",
                  "target_value": "team@example.com"
                }
              references:
                insight_id: posthog_insight.signups.id
              dependencies:
                posthog_dashboard.key_metrics: |-
                    {
                      "name": "Key metrics"
                    }
                posthog_insight.revenue: |-
                    {
