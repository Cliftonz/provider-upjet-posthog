                    }
            - name: weekly_prompt_digest
              manifest: |-
                {
                  "ai_prompt": "Top 5 events by volume this week, with counts and unique users for each.",
                  "ai_prompt_config": "${jsonencode({\n    window = { mode = \"last_n_days\", start_days_ago = 7, end_days_ago = null }\n  })}",
                  "byweekday": [
                    "monday"
                  ],
                  "frequency": "weekly",
                  "interval": 1,
                  "start_date": "2026-08-17T07:00:00Z",
                  "target_type": "email",
                  "target_value": "growth@example.com",
                  "title": "Weekly AI digest"
                }
              dependencies:
                posthog_dashboard.key_metrics: |-
                    {
                      "name": "Key metrics"
                    }
                posthog_insight.revenue: |-
                    {
                      "dashboard_ids": [
                        "${posthog_dashboard.key_metrics.id}"
                      ],
                      "name": "Revenue",
                      "query_json": "${jsonencode({\n    kind = \"InsightVizNode\"\n    source = {\n      kind   = \"TrendsQuery\"\n      series = [{ kind = \"EventsNode\", event = \"purchase\", math = \"sum\" }]\n    }\n  })}"
                    }
                posthog_insight.signups: |-
                    {
                      "dashboard_ids": [
                        "${posthog_dashboard.key_metrics.id}"
                      ],
                      "name": "Signups",
                      "query_json": "${jsonencode({\n    kind = \"InsightVizNode\"\n    source = {\n      kind   = \"TrendsQuery\"\n      series = [{ kind = \"EventsNode\", event = \"sign up\", math = \"total\" }]\n    }\n  })}"
                    }
        argumentDocs:
            ai_prompt: (String) Natural-language prompt for an AI-summary subscription. PostHog runs the prompt over your project data and delivers the result on the schedule. Exactly one of dashboard_id, insight_id, or ai_prompt must be set. The prompt text itself can be edited in place; switching to or from a dashboard/insight subject forces replacement.
            ai_prompt_config: (String) Optional JSON config for an ai_prompt subscription, e.g. the analysis window ({"window":{"mode":"last_n_days","start_days_ago":7,"end_days_ago":null}}). Compared semantically, so key ordering and whitespace do not produce a diff. Only meaningful when ai_prompt is set.
            bysetpos: (Number) Selects which occurrence within the period to use (rrule BYSETPOS), used together with byweekday on a monthly frequency. For example byweekday = ["monday"] with bysetpos = 1 means the first Monday of each month, and bysetpos = -1 means the last Monday. Positive values count from the start of the period, negative from the end. Leave unset for simple daily/weekly schedules.
            byweekday: (Set of String) Lowercase weekday names (monday..sunday) used with weekly/monthly frequency.
            created_at: (String) Timestamp when the subscription was created.
            dashboard_export_insights: (Set of Number) Insight IDs from the dashboard to include in the digest. Required and non-empty when dashboard_id is set (the API rejects an empty selection). Ignored for insight subscriptions.
            dashboard_id: (Number) ID of the dashboard to send a digest for. Exactly one of dashboard_id, insight_id, or ai_prompt must be set. Changing which subject is targeted forces replacement.
            enabled: (Boolean) Whether the subscription is active. Defaults to true. Set to false to pause without deleting.
            frequency: '(String) Recurrence unit: daily, weekly, monthly, or yearly.'
            id: (Number) Numeric ID of the subscription.
            insight_id: (Number) ID of a single insight to subscribe to. Exactly one of dashboard_id, insight_id, or ai_prompt must be set. Changing which subject is targeted forces replacement.
            integration_id: (Number) ID of the Slack integration to deliver through. Required when target_type is slack, and must be omitted for email. To find it, connect Slack under Settings → Integrations in the PostHog UI, then list this project's integrations via GET /api/projects/<project_id>/integrations/ and use the id of the entry whose kind is slack.
            interval: (Number) Every N of the frequency unit (e.g. interval = 2 with frequency = "weekly" is every two weeks).
            next_delivery_date: (String) Computed timestamp of the next scheduled delivery.
            project_id: (String) Project ID (environment) for this resource. Overrides the provider-level project_id.
            resource_type: '(String) Server-inferred subject type: dashboard, insight, or ai_prompt.'
            start_date: '(String) Required RFC3339 datetime that anchors the delivery schedule (the recurrence''s dtstart). It sets when in the cycle deliveries land — the time of day for daily, and the weekday/day-of-month plus time for weekly/monthly. PostHog requires it and has no server default, so it must always be set. Example: 2026-08-17T09:00:00Z delivers at 09:00 UTC.'
            summary: (String) Server-generated human-readable schedule summary (e.g. sent every week on Monday). Recomputed whenever the schedule changes.
            summary_enabled: (Boolean) Whether to attach an AI-generated summary to the delivery. Defaults to false.
            summary_prompt_guide: (String) Optional free-text guidance steering the AI summary (only used when summary_enabled is true).
            target_type: '(String) Delivery channel type: email or slack.'
            target_value: (String) Delivery target. For email a plain address (or comma-separated addresses). For slack the channel in the form <channelId>|#<channel-name> (e.g. C0B9A53J8RF|#reports). Stored verbatim; the API does not parse the pipe/#name suffix.
            title: (String) Optional human-readable label for the subscription.
        importStatements:
            - |-
              # Import using: project_id/subscription_id
              terraform import posthog_subscription.daily_slack_digest 12345/678

              # If project_id is configured at the provider level, you can omit it:
              terraform import posthog_subscription.daily_slack_digest 678
    posthog_survey:
        subCategory: ""
        description: Manage PostHog surveys via the project-scoped surveys API.
        name: posthog_survey
        title: posthog_survey Resource - posthog
        examples:
            - name: nps
              manifest: |-
                {
                  "conditions_json": "${jsonencode({\n    url = \"https://us.posthog.com/*\"\n  })}",
                  "description": "Quarterly NPS survey for PostHog users.",
                  "name": "PostHog NPS",
                  "questions_json": "${jsonencode([\n    {\n      type          = \"rating\"\n      question      = \"How would you rate your PostHog experience?\"\n      scale         = 10\n      buttonText    = \"Submit\"\n      isNpsQuestion = true\n    }\n  ])}",
                  "schedule": "once",
                  "type": "popover"
                }
            - name: feature_feedback
              manifest: |-
                {
                  "appearance_json": "${jsonencode({\n    submitButtonText = \"Send feedback\"\n  })}",
                  "linked_flag_id": 12345,
                  "name": "New onboarding feedback",
                  "questions_json": "${jsonencode([\n    {\n      type        = \"open\"\n      question    = \"What was the most confusing part of the new onboarding?\"\n      description = \"We read every response.\"\n    }\n  ])}",
                  "schedule": "always",
                  "type": "popover"
                }
        argumentDocs:
            appearance_json: (String) JSON object describing survey appearance settings.
            archived: (Boolean) Whether the survey is archived.
            conditions_json: (String) JSON object describing survey display and targeting conditions.
            create_in_folder: (String) Folder identifier used only during survey creation.
            created_at: (String) RFC3339 creation timestamp of the survey.
            created_by_json: (String) JSON object describing the survey creator.
            description: (String) Survey description.
            enable_iframe_embedding: (Boolean) Whether the survey is embeddable in an iframe.
            enable_partial_responses: (Boolean) Whether partial responses are stored when a respondent exits early.
            end_date: (String) RFC3339 end date for the survey.
            form_content_json: (String) JSON object describing custom form content.
            id: (String) UUID of the survey.
            internal_targeting_flag_json: (String) JSON object describing the internal targeting feature flag returned by the API.
            iteration_count: (Number) Number of survey recurrences when schedule is recurring.
            iteration_frequency_days: (Number) Number of days between recurrences when schedule is recurring.
            linked_flag_id: (Number) Feature flag ID linked to the survey. Remove this attribute to unlink the flag from the survey.
            linked_flag_json: (String) JSON object describing the linked feature flag returned by the API.
            linked_insight_id: (Number) Insight ID linked to the survey. This field is write-only in the PostHog API and is preserved from Terraform state when configured.
            name: (String) Survey name.
            project_id: (String) Project ID (environment) for this resource. Overrides the provider-level project_id.
            questions_json: (String) JSON array describing the survey questions.
            response_sampling_daily_limits_json: (String) JSON object describing daily response sampling limits.
            response_sampling_interval: (Number) Response sampling interval value.
            response_sampling_interval_type: (String) Response sampling interval type. Supported values are day, week, and month.
            response_sampling_limit: (Number) Maximum responses allowed during each sampling interval.
            response_sampling_start_date: (String) RFC3339 date when response sampling starts.
            responses_limit: (Number) Maximum number of responses allowed for the survey.
            schedule: (String) Survey schedule. Supported values are once, recurring, and always.
            start_date: (String) RFC3339 start date for the survey.
            targeting_flag_filters_json: (String) JSON object describing targeting flag filters. This input is write-only in the PostHog API and is preserved from Terraform state when configured.
            targeting_flag_id: (Number) Existing targeting feature flag ID to use for this survey. Remove this attribute to detach the targeting flag.
            targeting_flag_json: (String) JSON object describing the targeting feature flag returned by the API.
            translations_json: (String) JSON object describing translated survey content.
            type: (String) Survey type. Supported values are popover, widget, external_survey, and api.
        importStatements:
            - terraform import posthog_survey.example "<project_id>/<survey_uuid>"
    posthog_warehouse_table:
        subCategory: ""
        description: A self-managed PostHog data warehouse table that queries files in place from an S3-compatible bucket you control (Amazon S3, Google Cloud Storage via HMAC keys, Cloudflare R2, and similar). PostHog reads the files when the table is created to work out its columns, so the files must exist and the credentials must be able to read them. Changing format or url_pattern replaces the table; the table is queried by name, so saved queries keep working. Tables synced by a data source are managed with posthog_external_data_source instead.
        name: posthog_warehouse_table
        title: posthog_warehouse_table Resource - posthog
        examples:
            - name: orders
              manifest: |-
                {
                  "access_key": "${var.warehouse_bucket_access_key}",
                  "access_secret": "${var.warehouse_bucket_access_secret}",
                  "format": "Parquet",
                  "name": "orders",
                  "url_pattern": "https://your-bucket.s3.us-east-1.amazonaws.com/orders/*.parquet"
                }
              references:
                access_key: var.warehouse_bucket_access_key
                access_secret: var.warehouse_bucket_access_secret
        argumentDocs:
            access_key: (String, Sensitive) Access key ID for the bucket (an AWS access key ID, a Google Cloud HMAC key, or the equivalent for another S3-compatible store). It needs permission to list the bucket and read the files. PostHog never returns it, so Terraform keeps the configured value and cannot detect a key changed outside Terraform; after an import, the first apply sends the configured key.
            access_secret: (String, Sensitive) Secret for access_key. PostHog stores it encrypted and never returns it, so Terraform keeps the configured value.
            created_at: (String) Timestamp when the table was created.
            format: '(String) File format of every file the pattern matches: Parquet, CSV, CSVWithNames, JSONEachRow, Delta, or DeltaS3Wrapper. PostHog decides which values it accepts. Changing it replaces the table.'
            id: (String) Warehouse table ID (UUID).
            name: (String) Name the table is queried by in HogQL. Must be unique within the project, start with a letter or underscore, and contain only letters, numbers, and underscores.
            project_id: (String) Project ID (environment) for this resource. Overrides the provider-level project_id.
            url_pattern: (String) HTTPS URL of the files to read, with * matching any part of a path segment (e.g. https://your-bucket.s3.us-east-1.amazonaws.com/orders/*.parquet). All matched files are read as one table. Changing it replaces the table.
        importStatements:
            - |-
              # Import using: project_id/warehouse_table_id
              terraform import posthog_warehouse_table.example 12345/01900000-0000-7000-8000-000000000000

              # If project_id is configured at the provider level, you can omit it:
              terraform import posthog_warehouse_table.example 01900000-0000-7000-8000-000000000000

              # PostHog never returns the access key or secret, so the first apply after an
              # import sends the configured values as an in-place update.
