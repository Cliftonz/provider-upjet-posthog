                  "enabled": true,
                  "frequency": "monthly",
                  "integration_id": 1,
                  "interval": 1,
                  "start_date": "2026-08-17T07:00:00Z",
                  "target_type": "slack",
                  "target_value": "C0B9A53J8RF|#reports"
                }
              references:
                dashboard_export_insights: posthog_insight.revenue.id
                dashboard_id: posthog_dashboard.key_metrics.id
              dependencies:
                posthog_dashboard.key_metrics: |-
