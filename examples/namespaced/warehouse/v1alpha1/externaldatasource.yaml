apiVersion: v1
kind: Secret
metadata:
  name: example-externaldatasource-inputs
  namespace: default
type: Opaque
stringData:
  jobInputs: '{"host":"source-db.posthog.svc.cluster.local","port":5432,"database":"app","user":"reader","password":"reader","schema":"public"}'
  jobInputsUpdated: '{"host":"source-db.posthog.svc","port":5432,"database":"app","user":"reader","password":"reader","schema":"public"}'
---
apiVersion: warehouse.posthog.m.clifton.quest/v1alpha1
kind: ExternalDataSource
metadata:
  name: postgres-source
  namespace: default
  annotations:
    meta.upbound.io/example-id: warehouse/v1alpha1/externaldatasource
    uptest.upbound.io/post-assert-hook: 'testhooks/externaldatasource-api.sh'
    uptest.upbound.io/pre-delete-hook: 'testhooks/externaldatasource-api.sh updated || exit 1'
    uptest.upbound.io/post-delete-hook: 'testhooks/externaldatasource-api.sh deleted || exit 1'
spec:
  forProvider:
    sourceType: Postgres
    prefix: e2e_
    schemas:
      - orders
      - users
    jobInputsJsonSecretRef:
      name: example-externaldatasource-inputs
      key: jobInputs
  providerConfigRef:
    kind: ProviderConfig
    name: default
