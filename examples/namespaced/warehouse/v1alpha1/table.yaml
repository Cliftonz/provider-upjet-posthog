apiVersion: v1
kind: Secret
metadata:
  name: example-warehouse-table-credentials
  namespace: default
type: Opaque
stringData:
  accessKey: example-access-key-id
  accessSecret: example-secret-access-key
---
apiVersion: warehouse.posthog.m.clifton.quest/v1alpha1
kind: Table
metadata:
  name: orders
  namespace: default
  annotations:
    meta.upbound.io/example-id: warehouse/v1alpha1/table
    upjet.upbound.io/manual-intervention: "requires a public HTTPS object store holding the files"
spec:
  forProvider:
    name: orders
    format: Parquet
    urlPattern: https://example-bucket.s3.us-east-1.amazonaws.com/orders/*.parquet
    accessKeySecretRef:
      name: example-warehouse-table-credentials
      key: accessKey
    accessSecretSecretRef:
      name: example-warehouse-table-credentials
      key: accessSecret
  providerConfigRef:
    kind: ProviderConfig
    name: default
