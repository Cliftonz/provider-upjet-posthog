apiVersion: v1
kind: Secret
metadata:
  name: example-alertdestination-webhook
  namespace: default
type: Opaque
stringData:
  url: https://example.com/posthog-logs-alert
---
apiVersion: logs.posthog.m.clifton.quest/v1alpha1
kind: AlertDestination
metadata:
  name: checkout-errors-oncall
  namespace: default
  annotations:
    meta.upbound.io/example-id: logs/v1alpha1/alertdestination
    uptest.upbound.io/post-assert-hook: 'testhooks/alertdestination-api.sh'
    uptest.upbound.io/post-delete-hook: 'testhooks/alertdestination-api.sh deleted || exit 1'
spec:
  forProvider:
    type: webhook
    alertIdRef:
      name: checkout-errors-oncall-alert
    webhookUrlSecretRef:
      name: example-alertdestination-webhook
      key: url
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: logs.posthog.m.clifton.quest/v1alpha1
kind: Alert
metadata:
  name: checkout-errors-oncall-alert
  namespace: default
  annotations:
    meta.upbound.io/example-id: logs/v1alpha1/alertdestination
spec:
  forProvider:
    name: Checkout API errors (on-call)
    severityLevels:
      - error
      - fatal
    serviceNames:
      - checkout-api
    thresholdCount: 10
    thresholdOperator: above
    windowMinutes: 10
    evaluationPeriods: 3
    datapointsToAlarm: 2
    cooldownMinutes: 30
  providerConfigRef:
    kind: ProviderConfig
    name: default
