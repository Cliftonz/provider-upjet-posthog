apiVersion: logs.posthog.m.clifton.quest/v1alpha1
kind: Alert
metadata:
  name: checkout-errors
  namespace: default
  annotations:
    meta.upbound.io/example-id: logs/v1alpha1/alert
    uptest.upbound.io/post-assert-hook: 'testhooks/alert-api.sh'
    uptest.upbound.io/pre-delete-hook: 'testhooks/alert-api.sh updated || exit 1'
    uptest.upbound.io/post-delete-hook: 'testhooks/alert-api.sh deleted || exit 1'
    uptest.upbound.io/update-parameter: '{"name":"Checkout API errors updated"}'
spec:
  forProvider:
    name: Checkout API errors
    severityLevels:
      - error
      - fatal
    serviceNames:
      - checkout-api
    thresholdCount: 10
    thresholdOperator: above
    windowMinutes: 10
    evaluationPeriods: 3
    datapointsToAlarm: 2
    cooldownMinutes: 30
    enabled: true
    snoozeUntil: "2027-01-31T09:00:00Z"
    filterGroupJson: |
      {"type":"AND","values":[{"type":"AND","values":[{"type":"log_attribute","key":"status_code","operator":"exact","value":["500"]}]}]}
    blockedWindows:
      - start: "22:00"
        end: "06:00"
  providerConfigRef:
    kind: ProviderConfig
    name: default
