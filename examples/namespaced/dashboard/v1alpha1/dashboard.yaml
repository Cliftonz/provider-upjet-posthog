apiVersion: dashboard.posthog.m.clifton.quest/v1alpha1
kind: Dashboard
metadata:
  name: example-dashboard
  namespace: default
  annotations:
    meta.upbound.io/example-id: dashboard/v1alpha1/dashboard
    uptest.upbound.io/post-assert-hook: 'testhooks/dashboard-api.sh'
    uptest.upbound.io/post-delete-hook: 'testhooks/dashboard-api.sh'
    uptest.upbound.io/update-parameter: '{"description":"Updated description"}'
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    name: example-dashboard
    description: Example dashboard
    tags:
      - example
