apiVersion: survey.posthog.m.clifton.quest/v1alpha1
kind: Survey
metadata:
  name: example-nps
  namespace: default
  annotations:
    meta.upbound.io/example-id: survey/v1alpha1/survey
    uptest.upbound.io/post-assert-hook: 'testhooks/survey-api.sh'
    uptest.upbound.io/pre-delete-hook: 'testhooks/survey-api.sh updated || exit 1'
    uptest.upbound.io/post-delete-hook: 'testhooks/survey-api.sh deleted || exit 1'
    uptest.upbound.io/update-parameter: '{"description":"Updated description."}'
spec:
  forProvider:
    name: Example NPS
    description: Quarterly NPS survey.
    type: popover
    schedule: recurring
    iterationCount: 2
    iterationFrequencyDays: 90
    startDate: "2026-12-01T00:00:00Z"
    endDate: "2027-12-01T00:00:00Z"
    responsesLimit: 100
    responseSamplingStartDate: "2026-12-01T00:00:00Z"
    responseSamplingIntervalType: week
    responseSamplingInterval: 1
    responseSamplingLimit: 50
    enablePartialResponses: true
    enableIframeEmbedding: true
    appearanceJson: |
      {"backgroundColor":"#eeeeee"}
    questionsJson: |
      [{"type":"rating","question":"How would you rate your experience?","scale":10,"buttonText":"Submit","isNpsQuestion":true}]
    targetingFlagFiltersJson: |
      {"groups":[{"properties":[],"rollout_percentage":50}]}
    conditionsJson: |
      {"url":"https://example.com/*"}
  providerConfigRef:
    kind: ProviderConfig
    name: default
