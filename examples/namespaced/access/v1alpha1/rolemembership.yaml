apiVersion: access.posthog.m.clifton.quest/v1alpha1
kind: RoleMembership
metadata:
  name: example-rolemembership
  namespace: default
  annotations:
    meta.upbound.io/example-id: access/v1alpha1/rolemembership
    uptest.upbound.io/post-assert-hook: 'testhooks/rolemembership-api.sh'
    uptest.upbound.io/post-delete-hook: 'testhooks/rolemembership-api.sh deleted || exit 1'
    uptest.upbound.io/timeout: "300"
spec:
  forProvider:
    roleIdRef:
      name: example-rolemembership-role
    userUuid: ${data.POSTHOG_TEST_USER_UUID}
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: access.posthog.m.clifton.quest/v1alpha1
kind: Role
metadata:
  name: example-rolemembership-role
  namespace: default
  annotations:
    meta.upbound.io/example-id: access/v1alpha1/rolemembership
spec:
  forProvider:
    name: example-rolemembership-role
  providerConfigRef:
    kind: ProviderConfig
    name: default
