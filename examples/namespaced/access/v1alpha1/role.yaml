apiVersion: access.posthog.m.clifton.quest/v1alpha1
kind: Role
metadata:
  name: example-role
  namespace: default
  annotations:
    meta.upbound.io/example-id: access/v1alpha1/role
    uptest.upbound.io/post-assert-hook: 'testhooks/role-api.sh'
    uptest.upbound.io/post-delete-hook: 'testhooks/role-api.sh'
    uptest.upbound.io/update-parameter: '{"name":"example-role-updated"}'
    uptest.upbound.io/timeout: "300"
spec:
  forProvider:
    name: example-role
  providerConfigRef:
    kind: ProviderConfig
    name: default
