apiVersion: organization.posthog.m.clifton.quest/v1alpha1
kind: Member
metadata:
  name: example-orgmember
  namespace: default
  annotations:
    meta.upbound.io/example-id: organization/v1alpha1/member
    uptest.upbound.io/update-parameter: '{"level":"admin"}'
spec:
  forProvider:
    organizationId: "@current"
    userUuid: ${data.POSTHOG_TEST_USER_UUID}
    level: member
    retainOnDestroy: true
  providerConfigRef:
    kind: ProviderConfig
    name: default
