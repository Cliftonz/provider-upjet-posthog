apiVersion: cdp.posthog.m.clifton.quest/v1alpha1
kind: HogFunction
metadata:
  name: teams-destination
  namespace: default
  annotations:
    meta.upbound.io/example-id: cdp/v1alpha1/hogfunction
    uptest.upbound.io/post-assert-hook: 'testhooks/hogfunction-api.sh'
    uptest.upbound.io/pre-delete-hook: 'testhooks/hogfunction-api.sh updated || exit 1'
    uptest.upbound.io/post-delete-hook: 'testhooks/hogfunction-api.sh deleted || exit 1'
    uptest.upbound.io/update-parameter: '{"description":"Updated description"}'
spec:
  forProvider:
    name: example-teams-destination
    description: Microsoft Teams destination managed by Crossplane
    type: destination
    enabled: true
    templateId: template-microsoft-teams
    inputsJson: |
      {"webhookUrl":{"value":"https://example.webhook.office.com/webhookb2/e2e/IncomingWebhook/e2e/e2e"},"text":{"value":"{person.name} triggered {event.event}"}}
    filtersJson: |
      {"events":[{"id":"$pageview","type":"events"}]}
  providerConfigRef:
    kind: ProviderConfig
    name: default
