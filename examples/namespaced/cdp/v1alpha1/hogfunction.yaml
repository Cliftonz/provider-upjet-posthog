apiVersion: cdp.posthog.m.clifton.quest/v1alpha1
kind: HogFunction
metadata:
  name: webhook-destination
  namespace: default
  annotations:
    meta.upbound.io/example-id: cdp/v1alpha1/hogfunction
    uptest.upbound.io/post-assert-hook: 'testhooks/hogfunction-api.sh'
    uptest.upbound.io/pre-delete-hook: 'testhooks/hogfunction-api.sh updated || exit 1'
    uptest.upbound.io/post-delete-hook: 'testhooks/hogfunction-api.sh deleted || exit 1'
    uptest.upbound.io/update-parameter: '{"description":"Updated description"}'
spec:
  forProvider:
    name: example-webhook-destination
    description: Webhook destination managed by Crossplane
    type: destination
    enabled: true
    templateId: template-webhook
    inputsJson: |
      {"url":{"value":"https://example.com/posthog-webhook"},"method":{"value":"POST"},"body":{"value":{"event":"{event}","person":"{person}"}},"headers":{"value":{"Content-Type":"application/json"}}}
    filtersJson: |
      {"events":[{"id":"$pageview","type":"events"}]}
  providerConfigRef:
    kind: ProviderConfig
    name: default
