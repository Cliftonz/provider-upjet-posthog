apiVersion: project.posthog.m.clifton.quest/v1alpha1
kind: Member
metadata:
  name: example-projectmember
  namespace: default
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/member
    uptest.upbound.io/post-assert-hook: 'testhooks/member-api.sh'
    uptest.upbound.io/pre-delete-hook: 'testhooks/member-api.sh updated || exit 1'
    uptest.upbound.io/post-delete-hook: 'testhooks/member-api.sh deleted || exit 1'
    uptest.upbound.io/update-parameter: '{"accessLevel":"admin"}'
spec:
  forProvider:
    projectIdRef:
      name: example-member-project
    organizationMemberRef:
      name: example-projectmember-orgmember
    accessLevel: member
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: organization.posthog.m.clifton.quest/v1alpha1
kind: Member
metadata:
  name: example-projectmember-orgmember
  namespace: default
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/member
spec:
  forProvider:
    organizationId: "@current"
    userUuid: ${data.POSTHOG_TEST_USER_UUID}
    level: member
    retainOnDestroy: true
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: project.posthog.m.clifton.quest/v1alpha1
kind: Project
metadata:
  name: example-member-project
  namespace: default
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/member
spec:
  forProvider:
    name: crossplane-e2e-member
  providerConfigRef:
    kind: ProviderConfig
    name: default
