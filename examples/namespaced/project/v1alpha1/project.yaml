apiVersion: project.posthog.m.clifton.quest/v1alpha1
kind: Project
metadata:
  name: example-project
  namespace: default
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/project
    uptest.upbound.io/update-parameter: '{"name":"crossplane-e2e-project-updated"}'
    uptest.upbound.io/timeout: "600"
spec:
  forProvider:
    name: crossplane-e2e-project
    timezone: Europe/London
  providerConfigRef:
    kind: ProviderConfig
    name: default
