apiVersion: project.posthog.m.clifton.quest/v1alpha1
kind: DefaultAccess
metadata:
  name: example-defaultaccess
  namespace: default
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/defaultaccess
    uptest.upbound.io/post-assert-hook: 'testhooks/defaultaccess-api.sh'
    uptest.upbound.io/pre-delete-hook: 'testhooks/defaultaccess-api.sh updated || exit 1'
    uptest.upbound.io/update-parameter: '{"accessLevel":"none"}'
spec:
  forProvider:
    projectIdRef:
      name: example-defaultaccess-project
    accessLevel: member
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: project.posthog.m.clifton.quest/v1alpha1
kind: Project
metadata:
  name: example-defaultaccess-project
  namespace: default
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/defaultaccess
spec:
  forProvider:
    name: crossplane-e2e-defaultaccess
  providerConfigRef:
    kind: ProviderConfig
    name: default
