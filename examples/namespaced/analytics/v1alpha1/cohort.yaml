apiVersion: analytics.posthog.m.clifton.quest/v1alpha1
kind: Cohort
metadata:
  name: example-cohort
  namespace: default
  annotations:
    meta.upbound.io/example-id: analytics/v1alpha1/cohort
    uptest.upbound.io/post-assert-hook: 'testhooks/cohort-api.sh'
    uptest.upbound.io/pre-delete-hook: 'testhooks/cohort-api.sh updated || exit 1'
    uptest.upbound.io/post-delete-hook: 'testhooks/cohort-api.sh deleted || exit 1'
    uptest.upbound.io/update-parameter: '{"description":"Updated description"}'
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    name: example-cohort
    description: Persons with an example.com email
    filters: '{"properties":{"type":"AND","values":[{"type":"person","key":"email","operator":"icontains","value":"@example.com"}]}}'
