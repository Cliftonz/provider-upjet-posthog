apiVersion: analytics.posthog.m.clifton.quest/v1alpha1
kind: Insight
metadata:
  name: example-insight
  namespace: default
  annotations:
    meta.upbound.io/example-id: analytics/v1alpha1/insight
    uptest.upbound.io/post-assert-hook: 'testhooks/insight-api.sh'
    uptest.upbound.io/pre-delete-hook: 'testhooks/insight-api.sh updated || exit 1'
    uptest.upbound.io/post-delete-hook: 'testhooks/insight-api.sh deleted || exit 1'
    uptest.upbound.io/update-parameter: '{"name":"example-insight-updated"}'
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    name: example-insight
    queryJson: '{"kind":"InsightVizNode","source":{"kind":"TrendsQuery","series":[{"kind":"EventsNode","event":"$pageview","math":"total"}]}}'
