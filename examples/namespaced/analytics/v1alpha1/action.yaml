apiVersion: analytics.posthog.m.clifton.quest/v1alpha1
kind: Action
metadata:
  name: example-action
  namespace: default
  annotations:
    meta.upbound.io/example-id: analytics/v1alpha1/action
    uptest.upbound.io/post-assert-hook: 'testhooks/action-api.sh'
    uptest.upbound.io/pre-delete-hook: 'testhooks/action-api.sh updated || exit 1'
    uptest.upbound.io/post-delete-hook: 'testhooks/action-api.sh deleted || exit 1'
    uptest.upbound.io/update-parameter: '{"description":"Updated description"}'
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    name: example-action
    description: Tracks visits to the pricing page
    tags:
      - marketing
    stepsJson: '[{"event":"$pageview","url":"https://example.com/pricing","url_matching":"exact"}]'
