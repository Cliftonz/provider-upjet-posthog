apiVersion: analytics.posthog.m.clifton.quest/v1alpha1
kind: Insight
metadata:
  name: example-insight-sql
  namespace: default
  annotations:
    meta.upbound.io/example-id: analytics/v1alpha1/insight
    uptest.upbound.io/post-assert-hook: 'testhooks/insight-sql-api.sh'
    uptest.upbound.io/pre-delete-hook: 'testhooks/insight-sql-api.sh updated || exit 1'
    uptest.upbound.io/post-delete-hook: 'testhooks/insight-sql-api.sh deleted || exit 1'
    uptest.upbound.io/update-parameter: '{"name":"example-insight-sql-updated"}'
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    name: example-insight-sql
    querySql: SELECT count() FROM events
