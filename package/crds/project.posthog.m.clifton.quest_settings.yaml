        description: 'Settings is the Schema for the Settingss API. Manages environment-level
          settings for a PostHog project (environment). These settings live on the
          PostHog environment object (/api/environments/{id}/), which is distinct
          from the organization-scoped posthog_project resource. Each setting is optional
          - omitted attributes are left at whatever value PostHog currently has, and
          PostHog''s server-side default is read back into state. Updates send only
          configured settings. When a plan changes settings, omitted attributes become
          unknown, show as (known after apply), and refresh from PostHog after the
          update. References to omitted attributes can also be unknown until apply.
          ~> Singleton: There is only one settings object per project. This resource
          is a singleton - creating multiple instances for the same project will cause
          conflicts. ~> Destroy Behavior: Destroying this resource is a no-op. The
          provider also emits a warning naming the specific attribute(s) PostHog did
          not apply, so you can tell which setting is unavailable for your project
          rather than a provider bug. ~> Domains: app_urls is the project''s authorized-domains
          list — shown in PostHog settings as Web analytics domains and reused as
          the toolbar''s Authorized URLs (web analytics has no separate allowlist
          of its own). recording_domains is the session-replay domains list.'
