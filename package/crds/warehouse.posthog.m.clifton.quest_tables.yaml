          and similar). PostHog reads the files when the table is created to work
          out its columns, so the files must exist and the credentials must be able
          to read them. Changing format or url_pattern replaces the table; the table
          is queried by name, so saved queries keep working. Tables synced by a data
          source are managed with posthog_external_data_source instead.
