        description: 'Alert is the Schema for the Alerts API. Manage PostHog log alerts
          https://posthog.com/docs/logs/alerts. A log alert periodically counts the
          log entries matching its filters over a rolling window and fires when that
          count crosses the threshold. At least one of severity_levels, service_names,
          or filter_group_json is required unless the alert is disabled (enabled =
          false). A project may hold at most 20 log alerts. ~> An alert with no destination
          notifies nobody. It still evaluates and reports its state, but nothing is
          sent anywhere. Attach Slack, webhook or Microsoft Teams destinations with
          posthog_logs_alert_destination. PostHog builds each destination as a hog
          function internally, but you cannot create one yourself with posthog_hog_function:
          the API refuses any hog function filtering on a managed alert event with
          Alert notification destinations are managed through the alert API. Insight
          alerts are the one exception, since $insight_alert_firing predates the managed
          API; see examples/alert-notifications/main.tf for that chain. Replacing
          the alert, notably by changing project_id, creates a new alert with no destinations
          attached, and replaces every posthog_logs_alert_destination that points
          at it. Removing severity_levels, service_names, filter_group_json, or blocked_windows
          from your configuration clears them server-side. The remaining optional
          attributes are computed, so removing one retains its last applied value
          rather than restoring the documented default. Set it explicitly to change
          it back. Drift works the same way.'
